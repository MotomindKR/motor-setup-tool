[package]
name = "motomind-motor-calib"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
sha2 = "0.11"
ureq = "3.4"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_plot = "0.34"
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = "3.5"
neli = "0.6.5"
mujoco-rs = { version = "=6.1.0", features = ["auto-download-mujoco"] }
nalgebra = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
zbus = "5.19"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev]
opt-level = 1
