[package]
name = "motor-setup-tool"
version = "0.1.28"
edition = "2024"
rust-version = "1.95"
description = "Motomind motor calibration and setup tool for RobStride motors"
repository = "https://github.com/MotomindKR/motor-setup-tool"

[dependencies]
anyhow = "1"
sha2 = "0.11"
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
gsusbio = { version = "=0.1.0", default-features = false, features = ["blocking", "tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
dirs = "7"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
tempfile = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
mujoco-rs = { version = "=6.1.0", features = ["auto-download-mujoco"] }
socketcan = { version = "3.5", default-features = false, features = ["netlink"] }
neli = "0.6.5"

[target.'cfg(target_os = "windows")'.dependencies]
mujoco-rs = { version = "=6.1.0", features = ["auto-download-mujoco"] }

[target.'cfg(target_os = "macos")'.dependencies]
mujoco-rs = "=6.1.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev]
opt-level = 1
