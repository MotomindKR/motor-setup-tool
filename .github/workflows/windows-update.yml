name: Installed updater regression

on:
  workflow_dispatch:
    inputs:
      installer_run:
        description: Workflow run containing desktop installer artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  linux-update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: electron
      - uses: actions/download-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
          path: dist-electron
      - name: Test installed DEB update and checksum rejection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm cpio xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 libnotify4 xdg-utils
          node electron/test-linux-package.js dist-electron/*-linux-*.deb dist-electron/*-linux-*.rpm
          gh release download v0.1.22 --repo MotomindKR/motor-setup-tool --pattern 'motor-setup-tool-0.1.22-${{ matrix.platform }}.deb' --dir "$RUNNER_TEMP"
          sudo -E xvfb-run -a "$(command -v node)" electron/test-linux-update.js "$RUNNER_TEMP/motor-setup-tool-0.1.22-${{ matrix.platform }}.deb" "$PWD"/dist-electron/*-${{ matrix.platform }}.deb
      - name: Capture Linux window chrome
        shell: bash
        run: |
          dpkg-deb --extract dist-electron/*-linux-*.deb "$RUNNER_TEMP/chrome-app"
          xvfb-run -a node electron/capture-window-chrome.js "$RUNNER_TEMP/chrome-app/opt/Motor Setup Tool/motor-setup-tool" "$RUNNER_TEMP/window-chrome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-chrome-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/window-chrome/*.png
            ${{ runner.temp }}/window-chrome/*.json
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: electron
      - uses: actions/download-artifact@v4
        with:
          name: installers-win32-x64
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
          path: dist-electron
      - name: Test update handoff, install scopes, and failure recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.22 --repo MotomindKR/motor-setup-tool --pattern 'motor-setup-tool-0.1.22-win32-x64.exe' --dir "$env:RUNNER_TEMP"
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'motor-setup-tool-0.1.22-win32-x64.exe'
          $installer = (Get-ChildItem dist-electron -Filter '*-win32-x64.exe' -File | Select-Object -First 1).FullName
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron/test-windows-update.ps1 -OldInstaller $oldInstaller -Installer $installer
          if ($LASTEXITCODE -ne 0) { throw 'Windows update regression tests failed' }
      - name: Capture Windows window chrome
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-electron -Filter '*-win32-x64.exe' -File | Select-Object -First 1).FullName
          $location = Join-Path $env:RUNNER_TEMP 'chrome-app'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser', "/D=$location") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Chrome capture installation failed' }
          node electron/capture-window-chrome.js "$location/Motor Setup Tool.exe" "$env:RUNNER_TEMP/window-chrome"
          if ($LASTEXITCODE -ne 0) { throw 'Chrome capture failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-chrome-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/window-chrome/*.png
            ${{ runner.temp }}/window-chrome/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/motomind-update-tests/*/*.json
            ${{ runner.temp }}/motomind-update-tests/*/*.log
            ${{ runner.temp }}/motomind-update-tests/*/*.txt
            ${{ runner.temp }}/motomind-update-tests/*/*.png
