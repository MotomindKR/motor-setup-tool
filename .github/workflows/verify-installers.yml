name: Verify installers

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runners:
        description: JSON list of verification runners. The first runner builds the installers.
        required: true
        type: string
      installer_run:
        description: Source run for verification of previously built installers
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build
    if: ${{ !inputs.installer_run }}
    runs-on: ${{ fromJSON(inputs.runners)[0] }}
    timeout-minutes: 90
    env:
      MUJOCO_DOWNLOAD_DIR: ${{ github.workspace }}/.tools/mujoco
    steps:
      - uses: actions/checkout@v7
      - name: Verify upstream firmware images
        if: inputs.platform == 'linux-x64'
        shell: bash
        run: |
          jq -er '.[] | [.url, .sha256] | @tsv' src/firmware_catalog.json |
            while read -r url digest; do
              echo "Checking ${url##*/}"
              curl -fsSL --retry 3 --max-time 60 "$url" -o "$RUNNER_TEMP/firmware.bin"
              echo "$digest  $RUNNER_TEMP/firmware.bin" | sha256sum --check
            done
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --slurpfile desktop electron/package.json '
              .packages[] | select(.name == "motor-setup-tool") |
              .version == $desktop[0].version and ("v" + .version == env.RELEASE_TAG)'
      - name: Install Linux build and desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot rpm cpio xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 libnotify4 xdg-utils
      - name: Install macOS MuJoCo SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$MUJOCO_DOWNLOAD_DIR/mujoco-3.12.0/lib"
          mkdir -p "$sdk" "$RUNNER_TEMP/mujoco-mount"
          asset=mujoco-3.12.0-macos-universal2.dmg
          base=https://github.com/google-deepmind/mujoco/releases/download/3.12.0
          curl -fL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256")
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mujoco-mount" "$RUNNER_TEMP/$asset"
          source_lib="$(find "$RUNNER_TEMP/mujoco-mount" -name libmujoco.3.12.0.dylib -type f -print -quit)"
          test -n "$source_lib"
          cp "$source_lib" "$sdk/libmujoco.3.12.0.dylib"
          ln -s libmujoco.3.12.0.dylib "$sdk/libmujoco.dylib"
          install_name_tool -id @rpath/libmujoco.3.12.0.dylib "$sdk/libmujoco.3.12.0.dylib"
          codesign --force --sign - --timestamp=none "$sdk/libmujoco.3.12.0.dylib"
          hdiutil detach "$RUNNER_TEMP/mujoco-mount"
          echo "MUJOCO_DYNAMIC_LINK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Build Rust backend
        run: cargo build --locked --release
      - name: Build and test the native DXL worker
        run: |
          python -m pip install -r dxl/requirements-build.txt pytest
          python -m pytest -q -o pythonpath=dxl dxl/tests
          python dxl/build.py
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci
      - name: Check Electron code
        working-directory: electron
        env:
          MOTOMIND_DXL_PYTHON: python
          TEST_NATIVE_BACKEND: '1'
        run: npm run check
      - name: Build desktop installers
        working-directory: electron
        env: &installer_signing
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          MOTOMIND_REQUIRE_SIGNING: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: npm run package:installers
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ inputs.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.sha256
            dist-electron/latest*.yml
            dist-electron/*.blockmap

      - name: Build disposable next patch for updater tests
        id: next
        shell: bash
        run: |
          cd electron
          npm version patch --no-git-tag-version --ignore-scripts
          version=$(node -p "require('./package.json').version")
          cd ..
          sed -i.bak "s/^version = .*/version = \"$version\"/" Cargo.toml
          cargo build --offline --release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package disposable next patch
        env: *installer_signing
        run: npm --prefix electron run package:installers
      - uses: actions/upload-artifact@v7
        with:
          name: next-patch-${{ inputs.platform }}
          if-no-files-found: error
          path: |
            dist-electron/motor-setup-tool-${{ steps.next.outputs.version }}-*.deb
            dist-electron/motor-setup-tool-${{ steps.next.outputs.version }}-*.exe
            dist-electron/motor-setup-tool-${{ steps.next.outputs.version }}-*.zip
            dist-electron/latest-mac.yml

  verify:
    name: Verify on ${{ matrix.runner }}
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.installer_run && needs.build.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: electron
      - uses: actions/download-artifact@v8
        with:
          name: installers-${{ inputs.platform }}
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ github.token }}
          path: dist-electron
      - uses: actions/download-artifact@v8
        with:
          name: next-patch-${{ inputs.platform }}
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ github.token }}
          path: next-patch
      - name: Test installed DEB update and checksum rejection
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm cpio xvfb libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 libnotify4 xdg-utils
          node electron/test-linux-package.js dist-electron/*-linux-*.deb dist-electron/*-linux-*.rpm
          installer=("$PWD"/dist-electron/*-${{ inputs.platform }}.deb)
          previous=$(python3 packaging/previous-installer.py "${installer[@]}")
          sudo -E xvfb-run -a "$(command -v node)" electron/test-linux-update.js "$previous" "${installer[@]}" "$PWD"/next-patch/*.deb
      - name: Capture Linux window chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --extract dist-electron/*-linux-*.deb "$RUNNER_TEMP/chrome-app"
          xvfb-run -a node electron/capture-window-chrome.js "$RUNNER_TEMP/chrome-app/opt/Motor Setup Tool/motor-setup-tool" "$RUNNER_TEMP/window-chrome"
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: window-chrome-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/window-chrome/*.png
            ${{ runner.temp }}/window-chrome/*.json
      - name: Test update handoff, install scopes, and failure recovery
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist-electron -Filter '*-win32-x64.exe' -File).FullName
          $oldInstaller = python packaging/previous-installer.py $installer
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed' }
          $next = (Get-ChildItem next-patch -Filter '*.exe' -File).FullName
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron/test-windows-update.ps1 -OldInstaller $oldInstaller -Installer $installer -NextInstaller $next
          if ($LASTEXITCODE -ne 0) { throw 'Windows update regression tests failed' }
      - name: Capture Windows window chrome
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-electron -Filter '*-win32-x64.exe' -File | Select-Object -First 1).FullName
          $location = Join-Path $env:RUNNER_TEMP 'chrome-app'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser', "/D=$location") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Chrome capture installation failed' }
          node electron/capture-window-chrome.js "$location/Motor Setup Tool.exe" "$env:RUNNER_TEMP/window-chrome"
          if ($LASTEXITCODE -ne 0) { throw 'Chrome capture failed' }
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: window-chrome-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/window-chrome/*.png
            ${{ runner.temp }}/window-chrome/*.json
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: windows-update-diagnostics-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/motomind-update-tests/*/*.json
            ${{ runner.temp }}/motomind-update-tests/*/*.log
            ${{ runner.temp }}/motomind-update-tests/*/*.txt
            ${{ runner.temp }}/motomind-update-tests/*/*.png
      - name: Install from DMG and verify Gatekeeper acceptance
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/motor-dmg"
          mkdir -p "$mount" "$HOME/Applications"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" dist-electron/*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          app="$HOME/Applications/Motor Setup Tool.app"
          ditto "$mount/Motor Setup Tool.app" "$app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Install the signed ZIP through Settings and verify relaunch
        if: runner.os == 'macOS'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory next-patch &
          server=$!
          trap 'kill "$server"' EXIT
          node electron/test-macos-update.js "$HOME/Applications/Motor Setup Tool.app" next-patch/latest-mac.yml http://127.0.0.1:8765
      - name: Show updater diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          tail -100 "$HOME/Library/Application Support/Motor Setup Tool/update.log" || true
          tail -100 "$HOME/Library/Caches/com.motomind.MotorSetup.ShipIt/ShipIt_stderr.log" || true
