name: Electron desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MUJOCO_DOWNLOAD_DIR: ${{ github.workspace }}/.tools/mujoco
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("fs"); const cargo=fs.readFileSync("Cargo.toml","utf8").match(/^version = "([^"]+)"/m)[1]; const electron=require("./electron/package.json").version; if (cargo!==electron || process.env.RELEASE_TAG!==`v${cargo}`) process.exit(1)'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev fakeroot rpm
      - name: Install macOS MuJoCo SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$MUJOCO_DOWNLOAD_DIR/mujoco-3.12.0/lib"
          mkdir -p "$sdk" "$RUNNER_TEMP/mujoco-mount"
          asset=mujoco-3.12.0-macos-universal2.dmg
          base=https://github.com/google-deepmind/mujoco/releases/download/3.12.0
          curl -fL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$asset.sha256")
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mujoco-mount" "$RUNNER_TEMP/$asset"
          source_lib="$(find "$RUNNER_TEMP/mujoco-mount" -name libmujoco.3.12.0.dylib -type f -print -quit)"
          test -n "$source_lib"
          cp "$source_lib" "$sdk/libmujoco.3.12.0.dylib"
          ln -s libmujoco.3.12.0.dylib "$sdk/libmujoco.dylib"
          install_name_tool -id @rpath/libmujoco.3.12.0.dylib "$sdk/libmujoco.3.12.0.dylib"
          hdiutil detach "$RUNNER_TEMP/mujoco-mount"
          echo "MUJOCO_DYNAMIC_LINK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Build Rust backend
        run: cargo build --locked --release
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci
      - name: Check Electron code
        working-directory: electron
        run: npm run check
      - name: Build desktop installers
        working-directory: electron
        run: npm run package:installers
      - name: Test Windows silent upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.15 --repo MotomindKR/motor-setup-tool --pattern 'motor-setup-tool-0.1.15-win32-x64.exe' --dir "$env:RUNNER_TEMP"
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'motor-setup-tool-0.1.15-win32-x64.exe'
          $installer = (Get-ChildItem dist-electron -Filter '*-win32-x64.exe' -File | Select-Object -First 1).FullName
          $version = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File electron/test-windows-update.ps1 -OldInstaller $oldInstaller -Installer $installer -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows update regression tests failed' }
      - name: Upload Windows update diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-diagnostics
          path: |
            ${{ runner.temp }}/motomind-update-tests/*/*.json
            ${{ runner.temp }}/motomind-update-tests/*/*.log
            ${{ runner.temp }}/motomind-update-tests/*/*.txt
            ${{ runner.temp }}/motomind-update-tests/*/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.sha256

  publish:
    name: Publish desktop installers
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist-electron
      - name: Verify and publish
        working-directory: dist-electron
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' \) | wc -l)" -eq 6
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Motor Setup Tool $RELEASE_TAG" --notes 'Installers for Linux x64/ARM64 (DEB and RPM), macOS ARM64 (DMG), and Windows x64 (EXE). SHA256SUMS verifies each download. Settings → Check for update installs verified updates on Linux and Windows; macOS opens the DMG.'
          fi
          gh release upload "$RELEASE_TAG" ./*.deb ./*.rpm ./*.dmg ./*.exe SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
