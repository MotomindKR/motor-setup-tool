name: Electron desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      installer_run:
        description: Existing release CI run ID (verify its installers only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.installer_run || 'build' }}
  cancel-in-progress: false

jobs:
  verify-installers:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runners: '["ubuntu-22.04"]'
          - platform: linux-arm64
            runners: '["ubuntu-22.04-arm"]'
          - platform: darwin-arm64
            runners: '["macos-15"]'
          - platform: win32-x64
            runners: '["windows-2022", "windows-2025"]'
    uses: ./.github/workflows/verify-installers.yml
    with:
      platform: ${{ matrix.platform }}
      runners: ${{ matrix.runners }}
      installer_run: ${{ inputs.installer_run || '' }}
    secrets: inherit
    permissions:
      actions: read
      contents: read

  preview:
    name: Preview release
    if: github.event_name == 'workflow_dispatch' && !inputs.installer_run
    needs: verify-installers
    uses: ./.github/workflows/release-assets.yml

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify-installers
    uses: ./.github/workflows/release-assets.yml
    permissions:
      contents: write
