name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamixel:
    name: Dynamixel service and SDK tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r dxl/requirements.txt pytest
      - run: python -m pytest -q -o pythonpath=dxl dxl/tests
  frontend:
    name: Frontend build and interaction tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-test-results
          path: electron/test-results/
  test:
    name: Format, lint, and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/ci-cargo
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .tools/ci-cargo
            .tools/packaging
            target/ci
          key: native-22.04-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'packaging/downloads.json') }}
          restore-keys: native-22.04-${{ env.RUSTUP_TOOLCHAIN }}-
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - run: bash scripts/check-ci.sh
