name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and interaction tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: electron/test-results/
  test:
    name: Format, lint, and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools/ci-cargo
            .tools/packaging
            target/ci
          key: ci-22.04-rust1.98.1-amd64-${{ hashFiles('Cargo.lock', 'packaging/downloads.json', 'packaging/Dockerfile') }}
          restore-keys: ci-22.04-rust1.98.1-amd64-
      - name: Build test environment
        run: docker build -f packaging/Dockerfile -t motomind-tests .
      - name: Check formatting, Clippy, and unit tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/work/.tools/ci-cargo -v "$PWD:/work" \
            motomind-tests bash scripts/check-ci.sh
