name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and interaction tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: &test_runners [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:dxl
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-test-results-${{ matrix.os }}
          path: electron/test-results/
  test:
    name: Format, lint, and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: *test_runners
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.tools/ci-cargo
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r dxl/requirements.txt pytest
      - run: python -m pytest -q -o pythonpath=dxl dxl/tests
      - uses: actions/cache@v6
        with:
          path: |
            .tools/ci-cargo
            .tools/mujoco
            target/ci
          key: native-${{ matrix.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'packaging/mujoco.sha256') }}
          restore-keys: native-${{ matrix.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Install MuJoCo SDK
        if: runner.os != 'Windows'
        run: bash scripts/install-mujoco.sh
      - shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - shell: bash
        run: bash scripts/check-ci.sh

  frontend-result:
    name: Frontend build and interaction tests
    needs: frontend
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.frontend.result }}" = success

  test-result:
    name: Format, lint, and unit tests
    needs: test
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.test.result }}" = success
